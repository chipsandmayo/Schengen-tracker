name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build the APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: schengen-tracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish the APK as a release so it has a permanent direct download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/SchengenTracker.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SchengenTracker.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SchengenTracker.apk \
            --title "Schengen Tracker (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Download SchengenTracker.apk and open it on your Android phone." \
            --target "$GITHUB_SHA" --latest
