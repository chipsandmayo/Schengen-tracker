<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schengen 90/180 Tracker</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280;
    --accent: #1f4fd1; --accent-soft: #dbe5ff; --stay: #2f9e6b; --stay-soft: #d6f2e4;
    --warn: #c2410c; --danger: #b91c1c; --danger-soft: #fde2e2; --border: #e3e6eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 4px 0 12px; }

  .summary { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px;
             border: 1px solid var(--border); display: flex; gap: 12px; }
  .summary div { flex: 1; text-align: center; }
  .summary .num { font-size: 2rem; font-weight: 700; }
  .summary .lbl { font-size: .8rem; color: var(--muted); }
  .num.ok { color: var(--stay); } .num.low { color: var(--warn); } .num.over { color: var(--danger); }
  .note { font-size: .8rem; color: var(--muted); margin: -6px 0 14px; text-align: center; }

  .tabs { display: flex; background: var(--card); border-radius: 12px; padding: 4px;
          border: 1px solid var(--border); margin-bottom: 14px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 10px; border-radius: 9px;
                 font-size: .95rem; cursor: pointer; color: var(--muted); }
  .tabs button.active { background: var(--accent); color: #fff; font-weight: 600; }

  .card { background: var(--card); border-radius: 14px; padding: 14px; border: 1px solid var(--border); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head button { border: 1px solid var(--border); background: var(--card); border-radius: 8px;
                     width: 38px; height: 38px; font-size: 1.1rem; cursor: pointer; }
  .cal-head .title { font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .dow { text-align: center; font-size: .75rem; color: var(--muted); padding: 4px 0; }
  .day { aspect-ratio: 1; border: 0; background: none; border-radius: 8px; font-size: .9rem;
         cursor: pointer; color: var(--text); position: relative; }
  .day:hover { background: var(--bg); }
  .day.empty { cursor: default; }
  .day.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .day.stay { background: var(--stay-soft); }
  .day.over { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
  .day.range { background: var(--accent-soft); }
  .day.sel { background: var(--accent); color: #fff; font-weight: 600; }

  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .75rem; color: var(--muted); margin-top: 10px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px;
                         border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .lg-stay::before { background: var(--stay-soft); border: 1px solid var(--stay); }
  .lg-over::before { background: var(--danger-soft); border: 1px solid var(--danger); }
  .lg-sel::before { background: var(--accent); }

  .picker { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .picker p { margin: 0 0 10px; font-size: .9rem; }
  .row { display: flex; gap: 8px; }
  .btn { flex: 1; border: 0; border-radius: 10px; padding: 12px; font-size: .95rem; cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:disabled { opacity: .4; cursor: default; }
  .btn.ghost { background: var(--bg); color: var(--text); }
  .manual { margin-top: 12px; font-size: .85rem; }
  .manual summary { cursor: pointer; color: var(--accent); }
  .manual .row { margin-top: 8px; align-items: end; }
  .manual label { flex: 1; font-size: .75rem; color: var(--muted); }
  .manual input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-size: .9rem; }

  .trip { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .trip:last-child { border-bottom: 0; }
  .trip .info { flex: 1; }
  .trip .dates { font-weight: 600; font-size: .95rem; }
  .trip .meta { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .badge { display: inline-block; font-size: .7rem; padding: 2px 6px; border-radius: 6px; margin-left: 4px; }
  .badge.in { background: var(--stay-soft); color: var(--stay); }
  .badge.future { background: var(--accent-soft); color: var(--accent); }
  .badge.over { background: var(--danger-soft); color: var(--danger); }
  .remove { border: 1px solid var(--danger); color: var(--danger); background: none; border-radius: 8px;
            padding: 6px 10px; cursor: pointer; font-size: .85rem; }
  .empty-msg { text-align: center; color: var(--muted); padding: 24px 0; font-size: .9rem; }
  .hidden { display: none; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text);
           color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .9rem; opacity: 0;
           transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>Schengen 90/180 Tracker</h1>

  <section class="summary">
    <div><div class="num" id="used">0</div><div class="lbl">days used</div></div>
    <div><div class="num ok" id="left">90</div><div class="lbl">days left today</div></div>
  </section>
  <p class="note" id="window-note"></p>

  <nav class="tabs">
    <button id="tab-cal" class="active">Calendar</button>
    <button id="tab-trips">My trips (<span id="trip-count">0</span>)</button>
  </nav>

  <!-- Calendar tab -->
  <section id="view-cal" class="card">
    <div class="cal-head">
      <button id="prev" aria-label="Previous month">‹</button>
      <span class="title" id="month-title"></span>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span class="lg-stay">Day in Schengen</span>
      <span class="lg-over">Over the 90-day limit</span>
      <span class="lg-sel">Selected</span>
    </div>

    <div class="picker">
      <p id="pick-msg">Tap the day you <b>entered</b> the Schengen area.</p>
      <div class="row">
        <button class="btn ghost" id="clear">Clear</button>
        <button class="btn primary" id="add" disabled>Add trip</button>
      </div>
      <details class="manual">
        <summary>Or type the dates</summary>
        <div class="row">
          <label>Entry<input type="date" id="in-start"></label>
          <label>Exit<input type="date" id="in-end"></label>
          <button class="btn primary" id="add-manual" style="flex:0 0 auto">Add</button>
        </div>
      </details>
    </div>
  </section>

  <!-- Trips tab -->
  <section id="view-trips" class="card hidden">
    <div id="trip-list"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
// ---------- Rules ----------
// Schengen short-stay rule: at most 90 days in ANY rolling 180-day period.
// Both the entry day and the exit day count as days in the area.
const LIMIT = 90;
const WINDOW = 180;
const STORAGE_KEY = "schengen-trips-v1";

// ---------- Date helpers (all dates handled as UTC midnight to avoid DST issues) ----------
const DAY_MS = 86400000;
const toKey = d => d.toISOString().slice(0, 10);              // "2026-11-16"
const fromKey = k => new Date(k + "T00:00:00Z");
const addDays = (d, n) => new Date(d.getTime() + n * DAY_MS);
const todayUTC = () => { const n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
const fmt = d => d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const daysBetween = (a, b) => Math.round((b - a) / DAY_MS);

// ---------- State ----------
let trips = load();
let viewMonth = (() => { const t = todayUTC(); return new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), 1)); })();
let selStart = null, selEnd = null;

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(trips)); } catch {}
}

// Set of every day (as "YYYY-MM-DD") spent in Schengen. Overlapping trips are only counted once.
function stayDays() {
  const set = new Set();
  for (const t of trips) {
    for (let d = fromKey(t.start); d <= fromKey(t.end); d = addDays(d, 1)) set.add(toKey(d));
  }
  return set;
}

// Days spent in the 180-day window ending on (and including) `date`.
function usedOn(date, days) {
  let n = 0;
  for (let i = 0; i < WINDOW; i++) if (days.has(toKey(addDays(date, -i)))) n++;
  return n;
}

// ---------- Rendering ----------
function render() {
  const days = stayDays();
  const today = todayUTC();

  // Summary
  const used = usedOn(today, days);
  const left = LIMIT - used;
  document.getElementById("used").textContent = used;
  const leftEl = document.getElementById("left");
  leftEl.textContent = Math.max(left, 0);
  leftEl.className = "num " + (left < 0 ? "over" : left <= 14 ? "low" : "ok");
  const winStart = addDays(today, -(WINDOW - 1));
  document.getElementById("window-note").textContent =
    left < 0 ? `You are ${-left} day(s) over the limit for ${fmt(winStart)} – ${fmt(today)}.`
             : `Counting days between ${fmt(winStart)} and today.`;
  document.getElementById("trip-count").textContent = trips.length;

  renderCalendar(days, today);
  renderTrips(days, today);
}

function renderCalendar(days, today) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  document.getElementById("month-title").textContent =
    viewMonth.toLocaleDateString(undefined, { month: "long", year: "numeric", timeZone: "UTC" });

  ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].forEach(d => {
    const el = document.createElement("div"); el.className = "dow"; el.textContent = d; grid.appendChild(el);
  });

  const offset = (viewMonth.getUTCDay() + 6) % 7; // Monday first
  for (let i = 0; i < offset; i++) {
    const el = document.createElement("div"); el.className = "day empty"; grid.appendChild(el);
  }

  const month = viewMonth.getUTCMonth();
  for (let d = new Date(viewMonth); d.getUTCMonth() === month; d = addDays(d, 1)) {
    const key = toKey(d);
    const btn = document.createElement("button");
    btn.className = "day";
    btn.textContent = d.getUTCDate();
    if (key === toKey(today)) btn.classList.add("today");
    if (days.has(key)) btn.classList.add(usedOn(d, days) > LIMIT ? "over" : "stay");
    if (selStart && selEnd && d > selStart && d < selEnd) btn.classList.add("range");
    if ((selStart && key === toKey(selStart)) || (selEnd && key === toKey(selEnd))) btn.classList.add("sel");
    const date = new Date(d);
    btn.onclick = () => pick(date);
    grid.appendChild(btn);
  }

  // Picker message
  const msg = document.getElementById("pick-msg");
  const add = document.getElementById("add");
  if (!selStart) {
    msg.innerHTML = "Tap the day you <b>entered</b> the Schengen area.";
    add.disabled = true;
  } else if (!selEnd) {
    msg.innerHTML = `Entry: <b>${fmt(selStart)}</b>. Now tap the day you <b>left</b> (tap the same day for a 1-day visit).`;
    add.disabled = true;
  } else {
    const n = daysBetween(selStart, selEnd) + 1;
    msg.innerHTML = `<b>${fmt(selStart)}</b> → <b>${fmt(selEnd)}</b> (${n} day${n > 1 ? "s" : ""})`;
    add.disabled = false;
  }
}

function renderTrips(days, today) {
  const list = document.getElementById("trip-list");
  if (!trips.length) {
    list.innerHTML = `<div class="empty-msg">No trips yet. Add one from the Calendar tab — you can go back to earlier months to add past visits.</div>`;
    return;
  }
  const winStart = addDays(today, -(WINDOW - 1));
  const sorted = [...trips].sort((a, b) => b.start.localeCompare(a.start));
  list.innerHTML = "";
  for (const t of sorted) {
    const s = fromKey(t.start), e = fromKey(t.end);
    const n = daysBetween(s, e) + 1;
    // How many of this trip's days fall inside the current 180-day window
    let inWin = 0, over = false;
    for (let d = s; d <= e; d = addDays(d, 1)) {
      if (d >= winStart && d <= today) inWin++;
      if (usedOn(d, days) > LIMIT) over = true;
    }
    let badges = "";
    if (s > today) badges += `<span class="badge future">planned</span>`;
    else if (inWin) badges += `<span class="badge in">${inWin} day${inWin > 1 ? "s" : ""} counting now</span>`;
    if (over) badges += `<span class="badge over">over limit</span>`;

    const row = document.createElement("div");
    row.className = "trip";
    row.innerHTML = `
      <div class="info">
        <div class="dates">${fmt(s)} → ${fmt(e)}</div>
        <div class="meta">${n} day${n > 1 ? "s" : ""} ${badges}</div>
      </div>
      <button class="remove">Remove</button>`;
    row.querySelector(".remove").onclick = () => removeTrip(t.id, `${fmt(s)} → ${fmt(e)}`);
    list.appendChild(row);
  }
}

// ---------- Actions ----------
function pick(date) {
  if (!selStart || selEnd) { selStart = date; selEnd = null; }
  else if (date < selStart) { selEnd = selStart; selStart = date; }
  else { selEnd = date; }
  render();
}

function addTrip(start, end) {
  if (end < start) [start, end] = [end, start];
  trips.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), start: toKey(start), end: toKey(end) });
  save();
  selStart = selEnd = null;
  render();
  const n = daysBetween(start, end) + 1;
  toast(`Trip added (${n} day${n > 1 ? "s" : ""})`);
}

function removeTrip(id, label) {
  if (!confirm(`Remove the trip ${label}?`)) return;
  trips = trips.filter(t => t.id !== id);
  save();
  render();
  toast("Trip removed");
}

let toastTimer;
function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

function showTab(name) {
  document.getElementById("tab-cal").classList.toggle("active", name === "cal");
  document.getElementById("tab-trips").classList.toggle("active", name === "trips");
  document.getElementById("view-cal").classList.toggle("hidden", name !== "cal");
  document.getElementById("view-trips").classList.toggle("hidden", name !== "trips");
}

// ---------- Wiring ----------
document.getElementById("tab-cal").onclick = () => showTab("cal");
document.getElementById("tab-trips").onclick = () => showTab("trips");
document.getElementById("prev").onclick = () => {
  viewMonth = new Date(Date.UTC(viewMonth.getUTCFullYear(), viewMonth.getUTCMonth() - 1, 1)); render();
};
document.getElementById("next").onclick = () => {
  viewMonth = new Date(Date.UTC(viewMonth.getUTCFullYear(), viewMonth.getUTCMonth() + 1, 1)); render();
};
document.getElementById("clear").onclick = () => { selStart = selEnd = null; render(); };
document.getElementById("add").onclick = () => { if (selStart && selEnd) addTrip(selStart, selEnd); };
document.getElementById("add-manual").onclick = () => {
  const s = document.getElementById("in-start").value, e = document.getElementById("in-end").value;
  if (!s || !e) { toast("Enter both an entry and an exit date"); return; }
  addTrip(fromKey(s), fromKey(e));
  document.getElementById("in-start").value = document.getElementById("in-end").value = "";
};

render();
</script>
</body>
</html>
